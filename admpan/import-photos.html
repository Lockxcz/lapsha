<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>LAPSHA · Готовые фотографии</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111418;color:#eeefef;font:15px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:28px 18px}h1{font-size:clamp(26px,5vw,42px)}p{line-height:1.6;color:#b9c0ca}button,input,select{font:inherit;padding:12px;border-radius:10px;border:1px solid #48515e}button{background:#e6b97f;color:#15181d;cursor:pointer}button:disabled{opacity:.45;cursor:default}select{background:#222831;color:#fff;width:100%;margin:10px 0;padding:12px;border-radius:8px}input{background:#222831;color:#fff;max-width:100%}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}.card{border:1px solid #39424f;border-radius:14px;overflow:hidden;background:#1b2028}.card img{width:100%;height:230px;object-fit:contain;background:#fafafa;padding:12px}.card section{padding:14px}.card strong{display:block}.card p{font-size:13px;margin-bottom:0}a{color:#e6b97f}.notice{padding:16px;border:1px solid #48515e;border-radius:12px;white-space:pre-wrap}progress{width:100%;height:15px}#log{white-space:pre-wrap;font-size:13px;line-height:1.6}.login{display:flex;gap:12px;flex-wrap:wrap}[hidden]{display:none!important}</style>
<main><a href="./">← Админка</a><h1>Готовые фото для вашего меню</h1><p>Фотографии уже собраны в файле. Здесь они загрузятся в Supabase и привяжутся к существующим напиткам. Названия, цены, описания и порядок сохраняются. Позиции с фотографиями пропускаются.</p>
<form id="login" class="login" hidden><input id="email" type="text" autocapitalize="none" spellcheck="false" placeholder="Логин: admin" autocomplete="username" required><input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required><button>Войти</button></form>
<p id="status" class="notice" role="status">Проверяем вход…</p><div id="controls" hidden><div class="bar"><input id="file" type="file" accept="application/json,.json"><button id="check" disabled>Проверить готовый список</button><button id="apply" disabled>Импортировать фотографии</button><button id="stop" disabled>Остановить после текущего</button></div><progress id="progress" value="0" max="1"></progress><p id="summary"></p><div id="choices"></div><div id="log" role="log"></div><div id="grid" class="grid"></div></div></main>
<script src="../assets/login-alias.js"></script><script src="../assets/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="import-photos.js"></script></html>
